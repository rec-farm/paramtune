version: 2
# GitHub Actions: weekly version updates, grouped into a single PR.
# npm, cargo and docker: routine version bumps are disabled (open-pull-requests-limit: 0).
# Dependabot security updates (enabled in the repo settings) still open PRs for
# vulnerable dependencies, grouped into a single PR per ecosystem.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
