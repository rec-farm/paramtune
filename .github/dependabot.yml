version: 2
# Routine version bumps are disabled (open-pull-requests-limit: 0).
# Dependabot security updates are enabled in the repo settings and still open
# PRs for vulnerable dependencies; they're grouped into a single PR per ecosystem.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
