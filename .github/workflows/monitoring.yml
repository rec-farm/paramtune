name: Production monitoring

on:
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring.yml'
  push:
    branches: [master]
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate monitoring configuration
        run: npm exec --yes --package=@rec/stillup@0.2.0 -- stillup validate --config monitoring/stillup.config.json

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: monitoring-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: paramtune-production-monitoring
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned monitoring CLI
        run: npm install --prefix "$RUNNER_TEMP/stillup-cli" --no-audit --no-fund @rec/stillup@0.2.0
      - name: Test, preview, and apply production checks
        env:
          STILLUP_URL: 'https://stillup.rec.farm/api'
        run: |
          set -eu
          "$RUNNER_TEMP/stillup-cli/node_modules/.bin/stillup" test --config monitoring/stillup.config.json --yes
          "$RUNNER_TEMP/stillup-cli/node_modules/.bin/stillup" diff --config monitoring/stillup.config.json
          "$RUNNER_TEMP/stillup-cli/node_modules/.bin/stillup" apply --config monitoring/stillup.config.json --yes
