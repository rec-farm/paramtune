[package]
name = "paramtune-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Paramtune API server: platform schemas and versioned feature configuration on Redis"
license = "MIT"
repository = "https://github.com/rec-farm/paramtune"
homepage = "https://rec.farm/paramtune/"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "1.8", features = ["tokio-rustls-comp", "connection-manager"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
node-semver = "2.2"
sha2 = "0.11"
ryu-js = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
rand = "0.10"
base64 = "0.23"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
http-body-util = "0.1"
tempfile = "3"
